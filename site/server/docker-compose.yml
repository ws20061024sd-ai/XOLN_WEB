services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      # 只绑定本机，避免绕过 Nginx 直接暴露 3001 端口
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/server/data
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      # 在 server/.env 中配置，未配置时 compose 会直接报错
      - ADMIN_KEY=${ADMIN_KEY:?请在 server/.env 中设置 ADMIN_KEY}
      - STUDY_AI_KEY=${STUDY_AI_KEY:-}
      - STUDY_AI_MODEL=${STUDY_AI_MODEL:-deepseek-flash}
      - STUDY_SUPABASE_URL=${STUDY_SUPABASE_URL:-}
      - STUDY_SUPABASE_ANON_KEY=${STUDY_SUPABASE_ANON_KEY:-}
      - STUDY_ALLOWED_USER_ID=${STUDY_ALLOWED_USER_ID:-}
      - STUDY_AI_RESERVE_YUAN=${STUDY_AI_RESERVE_YUAN:-0.25}
